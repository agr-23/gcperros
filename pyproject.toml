[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gcperros"
version = "0.1.0"
description = "Pipeline de streaming de datos deportivos para analítica de apuestas en vivo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# El generador no declara dependencias a propósito: solo biblioteca estándar.
# Cualquier dependencia externa introduce una versión más que podría alterar el
# muestreo pseudoaleatorio y romper la reproducibilidad bajo semilla fija.
dependencies = []

[project.optional-dependencies]
# Cliente de Pub/Sub. Es opcional a propósito: los generadores y el motor no lo
# necesitan, y quien solo produzca ficheros no tiene por qué arrastrarlo.
pubsub = ["google-cloud-pubsub>=2.20"]

dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "commitizen>=4.0",
  "pre-commit>=4.0",
  "pytest-cov>=6.0",
  "google-cloud-pubsub>=2.20",
]

[project.scripts]
gcperros-generate-match = "gcperros.generators.cli:main"
gcperros-generate-odds = "gcperros.generators.cli:odds_main"
gcperros-publish = "gcperros.publishing.cli:main"
gcperros-validate = "gcperros.governance.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gcperros"]

###############################################################################
# Ruff — linter y formateador
###############################################################################

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # bugbear
  "A",         # builtins shadowing
  "C4",        # comprehensions
  "SIM",       # simplify
  "PTH",       # usar pathlib
  "RET",       # returns
  "ARG",       # argumentos sin usar
  "PL",        # pylint
  "RUF",       # reglas propias de ruff
  "ANN",       # anotaciones de tipo obligatorias
  "S",         # bandit (seguridad)
  "D",         # docstrings
]
ignore = [
  "D203",      # incompatible con D211
  "D213",      # incompatible con D212
  "S311",      # `random` no criptográfico: es justamente lo que necesitamos
]

[tool.ruff.lint.per-file-ignores]
# En las pruebas se permiten asserts y docstrings menos formales.
"tests/**" = ["S101", "D103", "PLR2004"]

# Los imports diferidos de la capa de publicación son deliberados: mantienen
# `google-cloud-pubsub` como dependencia opcional, de modo que el paquete se
# pueda usar para generar ficheros sin instalar el cliente. Moverlos arriba
# rompería esa propiedad.
"src/gcperros/publishing/cli.py" = ["PLC0415"]
"src/gcperros/publishing/pubsub.py" = ["PLC0415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

###############################################################################
# Mypy — verificación estática de tipos
###############################################################################

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]

# google-cloud-pubsub no distribuye marcadores de tipo, así que sus símbolos
# llegan sin anotar. Se acota la excepción a ese paquete en vez de sembrar el
# código de `type: ignore`.
[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

###############################################################################
# Pytest
###############################################################################

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "statistical: pruebas que agregan muchos partidos y tardan más en correr",
]

[tool.coverage.run]
branch = true
source = ["gcperros"]
# El adaptador real de Pub/Sub queda fuera de la medición: sólo se ejecuta con
# un broker delante, y no hay forma honesta de cubrirlo en la integración
# continua. Está escrito para ser trivial justamente por eso — toda la lógica
# que sí se puede probar vive en `publisher.py`.
omit = ["*/publishing/pubsub.py"]

[tool.coverage.report]
# Se excluyen las líneas que sólo se recorren sin la librería cliente instalada
# o al ejecutar un módulo como script: cubrirlas costaría más de lo que aporta.
exclude_also = [
  'if TYPE_CHECKING:',
  'raise NotImplementedError',
  'if __name__ == .__main__.:',
  '\.\.\.',
]

###############################################################################
# Commitizen — Conventional Commits
###############################################################################

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = ["pyproject.toml:^version"]
tag_format = "v$version"
