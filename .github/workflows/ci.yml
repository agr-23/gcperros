name: CI

# GitHub Actions no cobra minutos en repositorios públicos, que es el caso.
on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo sobre la misma rama cancela la ejecución anterior: no se gastan
# ejecuciones en revisiones ya superadas.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_DEFAULT: "3.12"
  REFERENCE_SEED: "20260826"

jobs:
  quality:
    name: Linters y ganchos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks necesita el historial para escanear los commits nuevos,
          # no sólo el árbol de trabajo.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
      - uses: pre-commit/action@v3.0.1

  types-and-tests:
    name: Tipos y pruebas · ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # El proyecto promete ficheros idénticos byte a byte en cualquier
          # sistema operativo, y el equipo desarrolla en Windows. Sin comprobarlo
          # en Windows esa promesa sería una suposición.
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Coherencia de dependencias
        run: python -m pip check
      - name: mypy
        run: mypy
      - name: pytest
        run: pytest --cov=gcperros --cov-report=term-missing --cov-fail-under=90

  reproducibility:
    name: Reproducibilidad
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
      - run: python -m pip install -e .
      # La HU-8 promete que la misma semilla produce el mismo partido byte a
      # byte. Se comprueba aquí y no sólo en una prueba unitaria porque es la
      # premisa de la que depende toda la validación posterior.
      - name: El mismo partido dos veces
        run: |
          gcperros-generate-match --seed "$REFERENCE_SEED" --out primera.jsonl
          gcperros-generate-match --seed "$REFERENCE_SEED" --out segunda.jsonl
          cmp primera.jsonl segunda.jsonl
          echo "Partido reproducible: $(wc -l < primera.jsonl) eventos idénticos."
      - name: Las mismas cuotas dos veces
        run: |
          gcperros-generate-odds --seed "$REFERENCE_SEED" --out cuotas-a.jsonl
          gcperros-generate-odds --seed "$REFERENCE_SEED" --out cuotas-b.jsonl
          cmp cuotas-a.jsonl cuotas-b.jsonl
      # La HU-16 rechaza en la frontera lo que incumple el contrato. Aquí se
      # comprueba la otra mitad, que es la que nadie vigila: que lo que el
      # propio proyecto produce cumple el contrato que declara. Si el generador
      # y el esquema se separan, este paso falla en vez de que lo descubra un
      # consumidor.
      - name: Los dos flujos cumplen su propio contrato
        run: |
          gcperros-validate --stream match --in primera.jsonl --strict > /dev/null
          gcperros-validate --stream odds --in cuotas-a.jsonl --strict > /dev/null

      # La HU-17 mide la calidad en el mismo acto de ingerir. Con --strict una
      # regresión de calidad rompe la construccion, en vez de descubrirse en una
      # auditoría al final.
      - name: Informe de calidad del flujo de referencia
        run: |
          gcperros-quality --stream match --in primera.jsonl --strict > /dev/null
          gcperros-quality --stream odds --in cuotas-a.jsonl --strict > /dev/null

      # La HU-18 promete que cualquier indicador se puede explicar a demanda.
      # Aquí se comprueba el cableado de punta a punta, sin broker.
      - name: Trazabilidad del flujo de referencia
        run: gcperros-trace --in primera.jsonl > /dev/null

      # El modo de ensayo recorre el camino completo de publicación sin salir
      # del proceso: verifica el cableado sin broker ni credenciales.
      - name: Publicación en modo de ensayo
        run: gcperros-publish --seed "$REFERENCE_SEED" --dry-run

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"
      - run: terraform fmt -check -recursive
      # -backend=false valida sintaxis y módulos sin credenciales de GCP ni
      # acceso al estado remoto.
      - run: terraform init -backend=false
      - run: terraform validate

  commit-messages:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
      - run: python -m pip install commitizen
      - name: Validar los mensajes de la rama
        run: cz check --rev-range origin/${{ github.base_ref }}..HEAD
